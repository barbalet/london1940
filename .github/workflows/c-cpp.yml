name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install validation dependencies
      run: python -m pip install -r requirements-test.txt
    - name: Build and run all supported tests
      run: ./tests/run_supported.sh
